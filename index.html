<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Assistant — розумний помічник</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:linear-gradient(135deg,#1e3a5f 0%,#2a4a7f 30%,#4a3a7a 65%,#7a2a5f 100%);
    min-height:100vh;display:flex;justify-content:center;padding:24px 16px;
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;color:#2a3040;
    background-attachment:fixed;
}
/* Плаваючі "бульбашки" на фоні */
body::before, body::after{
    content:'';position:fixed;border-radius:50%;filter:blur(80px);z-index:0;pointer-events:none;
}
body::before{
    width:420px;height:420px;background:rgba(90,160,255,0.22);top:-120px;left:-100px;
    animation:floatA 14s ease-in-out infinite alternate;
}
body::after{
    width:380px;height:380px;background:rgba(255,110,180,0.18);bottom:-100px;right:-80px;
    animation:floatB 16s ease-in-out infinite alternate;
}
@keyframes floatA{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,50px) scale(1.15)}}
@keyframes floatB{from{transform:translate(0,0) scale(1)}to{transform:translate(-50px,-40px) scale(1.1)}}
#app{width:760px;max-width:98vw;display:flex;flex-direction:column;gap:16px;padding-bottom:40px;position:relative;z-index:1}

/* ===== Header ===== */
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.header h1{
    font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px;
    color:#fff;text-shadow:0 2px 12px rgba(0,0,0,0.25);letter-spacing:0.3px;
}
.header h1 .dot{width:11px;height:11px;border-radius:50%;background:#4ade80;display:inline-block;animation:pulse 2s infinite;box-shadow:0 0 10px rgba(74,222,128,0.9)}
@keyframes pulse{0%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.85)}100%{opacity:1;transform:scale(1)}}
.lang-switch{display:flex;gap:5px;flex-wrap:wrap;background:rgba(255,255,255,0.12);padding:5px;border-radius:12px;backdrop-filter:blur(8px)}
.lang-switch button{
    padding:6px 12px;border:none;border-radius:9px;background:transparent;
    cursor:pointer;font-size:12px;font-weight:600;transition:0.18s;font-family:inherit;color:#dbe6f5;
}
.lang-switch button:hover{background:rgba(255,255,255,0.15);color:#fff}
.lang-switch button.active{background:linear-gradient(135deg,#3f6bb0,#6a4ab0);color:#fff;box-shadow:0 3px 10px rgba(63,107,176,0.4)}

/* ===== Card ===== */
.card{
    background:rgba(255,255,255,0.97);border-radius:22px;padding:28px 30px;
    box-shadow:0 20px 50px rgba(10,20,40,0.35), inset 0 1px 0 rgba(255,255,255,0.8);
    border:1px solid rgba(255,255,255,0.35);backdrop-filter:blur(14px);
    animation:fadeIn 0.4s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ===== Assistant ===== */
.assistant{display:flex;align-items:center;gap:18px;margin-bottom:20px}
.avatar{
    width:84px;height:84px;border-radius:50%;
    background:linear-gradient(135deg,#3f6bb0,#7a5ab0 55%,#c05a9a);
    display:flex;align-items:center;justify-content:center;
    font-size:42px;color:#fff;flex-shrink:0;position:relative;
    box-shadow:0 8px 24px rgba(90,80,180,0.45), 0 0 0 4px rgba(255,255,255,0.9), 0 0 40px rgba(120,90,200,0.35);
}
.avatar::after{
    content:'';position:absolute;inset:-8px;border-radius:50%;
    border:2px dashed rgba(120,90,200,0.45);animation:spin 18s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar.speaking{animation:speak 0.45s infinite alternate}
@keyframes speak{from{transform:scale(1)}to{transform:scale(1.08)}}
.assistant .info{flex:1}
.assistant .info .name{font-size:20px;font-weight:700;background:linear-gradient(135deg,#3f6bb0,#8a4ab0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.assistant .info .status{font-size:13px;color:#7a8aa0;margin-top:3px}
.status .rec-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e5533c;margin-right:6px;animation:pulse 0.9s infinite;box-shadow:0 0 8px rgba(229,83,60,0.8)}

/* ===== Speech bubble ===== */
.bubble{
    background:linear-gradient(135deg,#eef4ff,#f6f0ff);
    border-radius:16px;padding:16px 18px;font-size:15px;
    line-height:1.65;min-height:52px;border:1px solid #e2eaf8;margin-bottom:18px;
    display:flex;align-items:center;gap:12px;position:relative;
    box-shadow:0 4px 14px rgba(90,110,160,0.12);
}
.bubble::before{
    content:'';position:absolute;top:0;left:28px;right:28px;height:2px;
    background:linear-gradient(90deg,transparent,#8ab0e8,transparent);border-radius:2px;
}
.bubble .mic-ico{
    font-size:24px;width:44px;height:44px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(135deg,#3f6bb0,#7a5ab0);display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 12px rgba(90,80,180,0.3);
}
.bubble .placeholder{color:#8a96ae}

/* ===== Buttons ===== */
.actions{display:flex;gap:9px;flex-wrap:wrap}
.actions button{
    padding:12px 18px;border:none;border-radius:13px;font-size:14px;font-weight:600;
    cursor:pointer;transition:0.2s;display:flex;align-items:center;gap:8px;font-family:inherit;
    color:#fff;box-shadow:0 4px 14px rgba(0,0,0,0.15);position:relative;overflow:hidden;
}
.actions button::after{
    content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.22),transparent 55%);
    pointer-events:none;
}
.actions button:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 8px 20px rgba(0,0,0,0.22)}
.actions button:active{transform:translateY(0) scale(0.98)}
.btn-weather{background:linear-gradient(135deg,#3f8fb0,#2f6a9a)}
.btn-mic{background:linear-gradient(135deg,#e5533c,#c03a28)}
.btn-mic.listening{animation:pulse 1.2s infinite;box-shadow:0 0 0 0 rgba(229,83,60,0.6);animation:pulseRed 1.4s infinite}
@keyframes pulseRed{0%{box-shadow:0 0 0 0 rgba(229,83,60,0.55)}70%{box-shadow:0 0 0 16px rgba(229,83,60,0)}100%{box-shadow:0 0 0 0 rgba(229,83,60,0)}}
.btn-alarm{background:linear-gradient(135deg,#7a9a3f,#5a7a2f)}
.btn-currency{background:linear-gradient(135deg,#a86a3f,#8a552f)}
.btn-forecast{background:linear-gradient(135deg,#3f7ab0,#2f5a8a)}
.btn-notes{background:linear-gradient(135deg,#7a5ab0,#5a3a8a)}
.btn-calc{background:linear-gradient(135deg,#b05a7a,#8a3a5a)}
.btn-coin{background:linear-gradient(135deg,#c0a03f,#a07f2f)}
.btn-joke{background:linear-gradient(135deg,#3fa86a,#2f8a52)}
.btn-help{background:linear-gradient(135deg,#8a7ab0,#6a5a8a)}

/* ===== Command input ===== */
.cmd-input{display:flex;gap:8px;margin-top:16px}
.cmd-input input{
    flex:1;padding:12px 16px;border:2px solid #dde6f4;border-radius:13px;
    font-size:14px;font-family:inherit;outline:none;background:#fafcff;transition:0.2s;
}
.cmd-input input:focus{border-color:#7a9ad0;background:#fff;box-shadow:0 0 0 4px rgba(122,154,208,0.18)}
.cmd-input button{
    padding:12px 22px;background:linear-gradient(135deg,#3f6bb0,#6a4ab0);color:#fff;border:none;border-radius:13px;
    cursor:pointer;font-size:17px;font-family:inherit;transition:0.2s;box-shadow:0 4px 12px rgba(63,107,176,0.3);
}
.cmd-input button:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(63,107,176,0.4)}

/* ===== Chips ===== */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.chips button{
    padding:7px 13px;border:1.5px solid #dde4f2;border-radius:20px;background:#f7f9fd;
    cursor:pointer;font-size:12.5px;font-weight:600;font-family:inherit;color:#5a6a88;
    transition:0.18s;display:flex;align-items:center;gap:6px;
}
.chips button:hover{
    border-color:#7a9ad0;background:#eef3fc;color:#3f6bb0;transform:translateY(-1px);
    box-shadow:0 3px 8px rgba(90,120,180,0.15);
}
.chips button:active{transform:translateY(0) scale(0.97)}

/* ===== Reminders ===== */
.reminder-box{margin-top:18px;border-top:2px solid #eef2f8;padding-top:18px;display:none}
.reminder-box.show{display:block;animation:fadeIn 0.3s}
.reminder-box h3{font-size:15px;font-weight:700;margin-bottom:12px;color:#3a5a2a}
.add-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.add-row input{
    padding:10px 13px;border:2px solid #e2e8f2;border-radius:10px;font-size:14px;flex:1;min-width:120px;
    font-family:inherit;outline:none;transition:0.2s;
}
.add-row input[type=time]{max-width:110px;text-align:center}
.add-row input:focus{border-color:#7a9a3f;box-shadow:0 0 0 4px rgba(122,154,63,0.15)}
.add-row button{
    padding:10px 18px;background:linear-gradient(135deg,#7a9a3f,#5a7a2f);color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit;font-weight:600;transition:0.2s;
}
.add-row button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(90,122,47,0.35)}
.reminder-list{display:flex;flex-direction:column;gap:7px}
.reminder-item{
    display:flex;align-items:center;gap:10px;padding:11px 14px;background:linear-gradient(135deg,#f7faf0,#eef5e4);
    border:1px solid #e2ecd0;border-radius:11px;font-size:14px;transition:0.15s;
}
.reminder-item:hover{border-color:#c8dba8;box-shadow:0 3px 10px rgba(90,122,47,0.1)}
.reminder-item .r-time{font-weight:700;color:#5a7a2a;min-width:54px}
.reminder-item .r-text{flex:1;color:#3a4a30}
.reminder-item .r-del{
    background:rgba(255,255,255,0.7);border:1px solid #f0ddd6;border-radius:8px;cursor:pointer;font-size:15px;color:#c07a6a;padding:3px 8px;transition:0.15s;
}
.reminder-item .r-del:hover{color:#e5533c;border-color:#e5533c}
.reminder-item.fired{opacity:0.5;text-decoration:line-through}
.empty-rem{font-size:13px;color:#9aa8c0;text-align:center;padding:12px 0}

/* ===== Notes ===== */
.notes-box{margin-top:18px;border-top:2px solid #eef2f8;padding-top:18px;display:none}
.notes-box.show{display:block;animation:fadeIn 0.3s}
.notes-box h3{font-size:15px;font-weight:700;margin-bottom:12px;color:#4a2a7a}
.notes-list{display:flex;flex-direction:column;gap:7px}
.note-item{
    display:flex;align-items:center;gap:10px;padding:11px 14px;background:linear-gradient(135deg,#f7f4fc,#efe8f8);
    border:1px solid #e4dcf0;border-radius:11px;font-size:14px;transition:0.15s;
}
.note-item:hover{border-color:#c8b4e8;box-shadow:0 3px 10px rgba(90,60,140,0.1)}
.note-item .n-text{flex:1;color:#3a3a50;word-break:break-word}
.note-item .n-del{
    background:rgba(255,255,255,0.7);border:1px solid #e6d8f2;border-radius:8px;cursor:pointer;font-size:15px;color:#a08ac0;padding:3px 8px;transition:0.15s;
}
.note-item .n-del:hover{color:#e5533c;border-color:#e5533c}

/* ===== Log ===== */
.log-box{margin-top:18px}
.log-box h3{font-size:15px;font-weight:700;margin-bottom:10px;color:#3a4a7a}
.log{display:flex;flex-direction:column;gap:7px;max-height:220px;overflow-y:auto;padding-right:4px}
.log .entry{
    font-size:13px;color:#5a6a80;background:#f8fafd;border-radius:9px;padding:8px 13px;
    border:1px solid #eef2f8;border-left:3px solid #7a9ad0;animation:fadeIn 0.25s;
}
.log .entry b{color:#3f6bb0}
.log::-webkit-scrollbar{width:6px}
.log::-webkit-scrollbar-thumb{background:#c8d4e8;border-radius:3px}
.log::-webkit-scrollbar-thumb:hover{background:#9ab0d8}

/* ===== Footer hint ===== */
.footer-hint{text-align:center;font-size:12px;color:rgba(255,255,255,0.55);padding-top:4px}

</style>
</head>
<body>
<div id="app">
    <div class="header">
        <h1>🤖 <span id="titleText">Voice Assistant</span> <span class="dot"></span></h1>
        <div class="lang-switch" id="langSwitch">
            <button data-lang="uk" class="active">🇺🇦 UA</button>
            <button data-lang="ru">🇷🇺 RU</button>
            <button data-lang="en">🇬🇧 EN</button>
            <button data-lang="hu">🇭🇺 HU</button>
            <button data-lang="fr">🇫🇷 FR</button>
        </div>
    </div>

    <div class="card">
        <div class="assistant">
            <div class="avatar" id="avatar">🤖</div>
            <div class="info">
                <div class="name" id="assistantName">Асистент</div>
                <div class="status" id="assistantStatus">Готовий допомогти</div>
            </div>
        </div>

        <div class="bubble">
            <span class="mic-ico" id="bubbleIco">💬</span>
            <span id="bubbleText" class="placeholder">Скажи «погода» або натисни кнопку нижче…</span>
        </div>

        <div class="actions">
            <button class="btn-weather" onclick="askWeather()">🌤️ <span data-i18n="btnWeather">Погода</span></button>
            <button class="btn-forecast" onclick="askForecast()">📅 <span data-i18n="btnForecast">Прогноз</span></button>
            <button class="btn-mic" id="micBtn" onclick="toggleMic()">🎤 <span data-i18n="btnVoice">Голос</span></button>
            <button class="btn-alarm" onclick="toggleReminders()">⏰ <span data-i18n="btnAlarm">Нагадування</span></button>
            <button class="btn-currency" onclick="askCurrency()">💱 <span data-i18n="btnCurrency">Валюта</span></button>
            <button class="btn-notes" onclick="toggleNotes()">📝 <span data-i18n="btnNotes">Замітки</span></button>
            <button class="btn-calc" onclick="askCalc()">🧮 <span data-i18n="btnCalc">Калькулятор</span></button>
            <button class="btn-coin" onclick="flipCoin()">🪙 <span data-i18n="btnCoin">Монетка</span></button>
            <button class="btn-joke" onclick="tellJoke()">😂 <span data-i18n="btnJoke">Жарт</span></button>
            <button class="btn-help" onclick="showHelp()">❓ <span data-i18n="btnHelp">Допомога</span></button>
        </div>

        <div class="cmd-input">
            <input type="text" id="cmdInput" placeholder="Введи команду…" maxlength="80">
            <button onclick="sendCommand()">➤</button>
        </div>

        <div class="chips" id="chips">
            <button onclick="runChip('weather')">🌤️ <span data-i18n="chipWeather">погода</span></button>
            <button onclick="runChip('forecast')">📅 <span data-i18n="chipForecast">прогноз</span></button>
            <button onclick="runChip('currency')">💱 <span data-i18n="chipCurrency">курс</span></button>
            <button onclick="runChip('joke')">😂 <span data-i18n="chipJoke">жарт</span></button>
            <button onclick="runChip('coin')">🪙 <span data-i18n="chipCoin">монетка</span></button>
            <button onclick="runChip('quote')">💬 <span data-i18n="chipQuote">цитата</span></button>
            <button onclick="runChip('timer')">⏱️ <span data-i18n="chipTimer">таймер</span></button>
            <button onclick="runChip('help')">❓ <span data-i18n="chipHelp">допомога</span></button>
        </div>

        <div class="reminder-box" id="reminderBox">
            <h3>⏰ <span data-i18n="remTitle">Мої нагадування</span></h3>
            <div class="reminder-list" id="reminderList"></div>
            <div class="add-row">
                <input type="time" id="remTime" value="09:00">
                <input type="text" id="remText" placeholder="Наприклад: подзвонити мамі" maxlength="60">
                <button onclick="addReminder()"><span data-i18n="remAdd">Додати</span></button>
            </div>
        </div>

        <div class="notes-box" id="notesBox">
            <h3>📝 <span data-i18n="notesTitle">Мої замітки</span></h3>
            <div class="notes-list" id="notesList"></div>
            <div class="add-row">
                <input type="text" id="noteText" placeholder="Напиши замітку…" maxlength="120">
                <button onclick="addNote()"><span data-i18n="notesAdd">Додати</span></button>
            </div>
        </div>

        <div class="log-box">
            <h3>📋 <span data-i18n="logTitle">Журнал</span></h3>
            <div class="log" id="log"></div>
        </div>
    </div>
</div>
<div class="footer-hint">🤖 Voice Assistant · 5 мов · безкоштовні API</div>

// ============================================================
// СТАН
// ============================================================
let lang = 'uk';
let reminders = loadReminders();
let recognition = null;
let isListening = false;
let voiceEnabled = true;

function loadReminders() {
    try { return JSON.parse(localStorage.getItem('vaReminders') || '[]'); }
    catch (e) { return []; }
}
function saveReminders() {
    try { localStorage.setItem('vaReminders', JSON.stringify(reminders)); } catch (e) {}
}

// ============================================================
// I18N
// ============================================================
function t(key, vars) {
    let s = (I18N[lang] && I18N[lang][key]) || I18N.uk[key] || key;
    if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
    return s;
}

const $ = id => document.getElementById(id);

function setLang(l) {
    lang = l;
    document.querySelectorAll('.lang-switch button').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === l);
    });
    document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
    });
    $('titleText').textContent = t('title');
    $('assistantName').textContent = t('name');
    $('assistantStatus').textContent = t('statusReady');
    $('bubbleText').textContent = t('bubbleDefault');
    $('remText').placeholder = t('remPlaceholder');
    $('noteText').placeholder = t('notesPlaceholder');
    $('cmdInput').placeholder = t('placeHolder');
    renderReminders();
    renderNotes();
}

document.getElementById('langSwitch').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (btn) setLang(btn.dataset.lang);
});

// ============================================================
// ОЗВУЧЕННЯ
// ============================================================
const VOICE_LANG = { uk: 'uk-UA', ru: 'ru-RU', en: 'en-US', hu: 'hu-HU', fr: 'fr-FR' };
const REC_LANG = { uk: 'uk-UA', ru: 'ru-RU', en: 'en-US', hu: 'hu-HU', fr: 'fr-FR' };

function speak(text) {
    if (!voiceEnabled || !('speechSynthesis' in window)) return;
    try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = VOICE_LANG[lang] || 'uk-UA';
        u.rate = 1.0;
        const voices = window.speechSynthesis.getVoices();
        const v = voices.find(v => v.lang && v.lang.startsWith(VOICE_LANG[lang].slice(0, 2)));
        if (v) u.voice = v;
        window.speechSynthesis.speak(u);
        const avatar = $('avatar');
        avatar.classList.add('speaking');
        u.onend = () => avatar.classList.remove('speaking');
    } catch (e) { /* ignore */ }
}

function addLog(action, detail) {
    const log = $('log');
    const now = new Date();
    const ts = now.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `<b>[${ts}] ${action}:</b> ${detail}`;
    log.prepend(div);
    while (log.children.length > 12) log.removeChild(log.lastChild);
}

function askWeather() {
    $('assistantStatus').textContent = t('statusThinking');
    $('bubbleIco').textContent = '🌤️';
    $('bubbleText').textContent = t('weatherFetching');
    if (!navigator.geolocation) { say(t('weatherLocError')); return; }

    navigator.geolocation.getCurrentPosition(async pos => {
        try {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat +
                        '&longitude=' + lon + '&current_weather=true';
            const res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            const temp = Math.round(data.current_weather.temperature);
            let advice;
            if (temp <= 5) advice = t('adviceCold');
            else if (temp <= 15) advice = t('adviceCool');
            else if (temp <= 25) advice = t('adviceWarm');
            else advice = t('adviceHot');

            // Назва міста через reverse geocoding (безкоштовно, без ключа)
            let city = '';
            try {
                const locLang = lang === 'uk' ? 'uk' : lang === 'ru' ? 'ru' : lang === 'hu' ? 'hu' : 'fr';
                const geoUrl = 'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' +
                    lat + '&longitude=' + lon + '&localityLanguage=' + locLang;
                const geoRes = await fetch(geoUrl);
                if (geoRes.ok) {
                    const geo = await geoRes.json();
                    city = geo.city || geo.locality || geo.principalSubdivision || '';
                }
            } catch (e) { /* city is optional */ }

            const text = city
                ? t('weatherCity', { city, temp, advice })
                : t('weatherTemp', { temp, advice });
            say(text, t('logWeather'));
        } catch (e) {
            say(t('weatherFail'));
        }
    }, () => {
        say(t('weatherLocError'));
    }, { timeout: 10000 });
}

function askForecast() {
    $('assistantStatus').textContent = t('statusThinking');
    $('bubbleIco').textContent = '📅';
    $('bubbleText').textContent = t('statusThinking');
    navigator.geolocation.getCurrentPosition(async pos => {
        try {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat +
                '&longitude=' + lon +
                '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset' +
                '&timezone=auto&forecast_days=3';
            const res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            const d = data.daily;

            // Дні тижня коротко
            const wd = (i) => {
                const date = new Date(d.time[i] + 'T12:00:00');
                return date.toLocaleDateString(lang, { weekday: 'short' });
            };
            const dayTemp = (i) => Math.round(d.temperature_2m_max[i]) + '/' + Math.round(d.temperature_2m_min[i]);

            const text = t('forecastText', {
                d1: wd(0), t1: dayTemp(0),
                d2: wd(1), t2: dayTemp(1),
                d3: wd(2), t3: dayTemp(2),
            });

            // Схід/захід сонця

                const set = d.sunset[0] ? d.sunset[0].slice(11, 16) : '';
                if (rise && set) sun = ' ' + t('sunText', { rise, set });
            } catch (e) { /* sun optional */ }

            say(text + sun, t('logWeather'));
        } catch (e) {
            say(t('forecastFail'));
        }
    }, () => {
        say(t('weatherLocError'));
    }, { timeout: 10000 });

function tryCalc(text) {
    const m = text.match(/(\d+[+\-*\/xх×÷][\d+\-*\/xх×÷. ()]+)/iu);
    if (!m) return false;
    let expr = m[1].replace(/x/gi, '*').replace(/х/gi, '*').replace(/×/g, '*').replace(/÷/g, '/');
    if (!/^[0-9+\-*/(). ]+$/.test(expr)) return false;
    try {
        const res = Function('"use strict";return (' + expr + ')')();
        if (typeof res === 'number' && isFinite(res)) {
            const rounded = Math.round(res * 100) / 100;
            say(t('calcResult', { expr: m[1].trim(), res: rounded }));
            return true;
        }
    } catch (e) { /* invalid */ }
    return false;
}

function trySetTimer(text) {
    // «таймер на 5 хвилин», «timer for 3 minutes», «таймер 30 секунд»
    const m = text.match(/(\d{1,3})\s*(?:хвилин[аи]?|хв\b|минут[ыу]?|мин\b|minute|minutes|min\b|percre|perc\b|secondes?|секунд[ауы]?|сек\b|sec\b|másodpercre|mp\b)/iu);
    if (!m) return false;
    const n = parseInt(m[1], 10);
    if (!n || n < 1 || n > 120) return false;
    const isMin = /(хвилин|минут|minute|min\b|percre|perc)/iu.test(m[0]);
    const unit = isMin ? t('unitMin') : t('unitSec');
    const secs = isMin ? n * 60 : n;

    if (timerHandle) clearTimeout(timerHandle);
    say(t('timerSet', { n, unit }));
    timerHandle = setTimeout(() => {
        playAlarmSound();
        say(t('timerDone'));
    }, secs * 1000);
    return true;
}

function checkReminders() {
    const now = new Date();

// Простий звук нагадування (Web Audio API — без файлів)
function playAlarmSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [880, 1108.73, 1318.51, 1760];
        notes.forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.001, ctx.currentTime + i * 0.18);
            gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + i * 0.18 + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.18 + 0.16);
            osc.connect(gain).connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.18);
            osc.stop(ctx.currentTime + i * 0.18 + 0.2);
        });
    } catch (e) { /* audio optional */ }
}

// ГОЛОСОВЕ КЕРУВАННЯ
// ============================================================
function toggleMic() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
        say(t('micUnsupported'));
        return;
    }
    if (isListening) { recognition.stop(); return; }
    if (!recognition) {
        recognition = new SR();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.onresult = e => {
            const text = e.results[0][0].transcript.trim().toLowerCase();
            $('assistantStatus').textContent = t('statusThinking');
            handleVoiceCommand(text);
        };
        recognition.onerror = e => {
            isListening = false;
            $('micBtn').classList.remove('listening');
            $('assistantStatus').textContent = t('statusReady');
            if (e.error !== 'aborted' && e.error !== 'no-speech') {
                say(t('unknownCmd'));
            }
        };
        recognition.onend = () => {
            isListening = false;
            $('micBtn').classList.remove('listening');
            $('assistantStatus').textContent = t('statusReady');
        };
    }
    try {
        recognition.lang = REC_LANG[lang] || 'uk-UA';
        recognition.start();
        isListening = true;
        $('micBtn').classList.add('listening');
        $('assistantStatus').textContent = t('statusListening');
        $('bubbleIco').textContent = '🎤';
        $('bubbleText').textContent = t('statusListening');
    } catch (e) { /* already started */ }
}

function handleVoiceCommand(text) {
    addLog(t('logMic'), text);
    text = ' ' + text + ' ';
    // Погода
    if (/(^|\s)(погод|weather|météo|időjár|време|погода)(\s|$)/iu.test(text)) {
        askWeather();
        return;
    }
    // Прогноз
    if (/(^|\s)(прогноз|forecast|prévisions|előrejelzés|погода на)(\s|$)/iu.test(text)) {
        askForecast();
        return;
    }
    // Калькулятор
    if (tryCalc(text)) return;
    if (/(^|\s)(калькулятор|calculator|calcul|számológép)(\s|$)/iu.test(text)) {
        askCalc();
        return;
    }
    // Монетка
    if (/(^|\s)(монет|орёл|орел|решка|coin|piece|pénzfeldob|підкинь)(\s|$)/iu.test(text)) {
        flipCoin();
        return;
    }
    // Жарт
    if (/(^|\s)(жарт|шутк|joke|blague|vicc|анекдот)(\s|$)/iu.test(text)) {
        tellJoke();
        return;
    }
    // Замітки
    if (/(^|\s)(замітк|заметк|note|notes)(\s|$)/iu.test(text)) {
        toggleNotes();
        say(t('noteCmd'));
        return;
    }
    // Валюта
    if (/(^|\s)(курс|валюта|currency|taux|devise|deviza|арбуз|валют)(\s|$)/iu.test(text) || /(курс валют|курс долара|курс доллара|курс євро|курс евро|доллар|долар|євро|евро|exchange rate)/iu.test(text)) {
        askCurrency();
        return;
    }
    // Котра година
    if (/(^|\s)(котра година|который час|what time|quelle heure|mennyi az idő|час|time)(\s|$)/iu.test(text)) {
        const now = new Date();
        const time = now.toLocaleTimeString(lang, { hour: '2-digit', minute: '2-digit' });
        say(t('timeNow', { time }), t('logTime'));
        return;
    }
    // Яка дата
    if (/(^|\s)(яка дата|какое число|какая дата|what date|quelle date|milyen dátum|дата|date)(\s|$)/iu.test(text)) {
        askDate();
        return;
    }
    // Ім'я користувача: «мене звати Женя», «my name is Zhenya»
    if (trySaveName(text)) {
        return;
    }
    // Таймер: «таймер на 5 хвилин», «set a timer for 3 minutes»
    if (/(^|\s)(таймер|timer|minuteur|időzítő)(\s|$)/iu.test(text)) {
        if (trySetTimer(text)) return;
        askTimer();
        return;
    }
    // Цитата
    if (/(^|\s)(цитата|цитату|цитат\b|quote|citation|idézet)(\s|$)/iu.test(text) || /(^|\s)цитат[\sауеюя]/iu.test(text)) {
        askQuote();
        return;
    }
    // Хто ти / що вмієш
    if (/(хто ти|що ти вмієш|что ты умеешь|who are you|what can you do|qui es-tu|que sais-tu|mit tudsz|kicsoda vagy|кто ты)/iu.test(text)) {
        whoAmI();
        return;
    }
    // Настрій
    if (/(як справи|как дела|how are you|comment ça va|hogy vagy)/iu.test(text)) {
        askMood();
        return;
    }
    // Вітання
    if (/(^|\s)(привіт|здравств|привет|hello|hi|bonjour|szia|sziasztok)(\s|$)/iu.test(text)) {
        greet();
        return;
    }
    // Прощання
    if (/(^|\s)(до побачення|пока|bye|goodbye|au revoir|viszlát)(\s|$)/iu.test(text)) {
        say(t('goodbye'));
        return;
    }
    // Подяка
    if (/(^|\s)(дякую|спасибо|thanks|thank you|merci|kösz)(\s|$)/iu.test(text)) {
        say(t('thanks'));
        return;
    }
    // Нагадування
    if (/(^|\s)(нагадай|напомни|remind|rappelle|emlékeztess)(\s|$)/iu.test(text)) {
        parseReminderCommand(text);
        return;
    }
    // Допомога
    if (/(допомож|помощ|help|aide|segítség)/iu.test(text)) {
        say(t('helpText'));
        return;
    }
    say(t('unknownCmd'));
}

function parseReminderCommand(text) {
    // Спробуємо знайти час HH:MM або "о 18:34", "в 8 утра"
    let time = null;
    const hhmm = text.match(/(\d{1,2})[.:](\d{2})/);
    if (hhmm) {
        let h = parseInt(hhmm[1], 10);
        let m = parseInt(hhmm[2], 10);
        if (h < 0 || h > 23) h = Math.min(23, Math.abs(h) % 24);
        if (m < 0 || m > 59) m = 0;
        time = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    } else {
        // Спроба: "в 6 вечера", "о 9 утра"
        const hourWord = text.match(/(\d{1,2})\s*(?:годин|часов|часа|heures|óra)/iu);
        const per = text.match(/(?:в|о|at|à)\s*(\d{1,2})\b/iu);
        const hour = (hourWord && hourWord[1]) || (per && per[1]);
        if (hour) {
            let h = parseInt(hour, 10);
            if (/вечор|вечера|pm|soir/iu.test(text)) h = (h + 12) % 24;
            time = String(h).padStart(2, '0') + ':00';
        }
    }

    // Текст нагадування: прибираємо слова-команди (кирилиця не дружить з \b, тому через \s*...\s*)
    let clean = text.replace(/\s*(нагадай|напомни|remind me|remind|rappelle|emlékeztess)\s*/giu, ' ');
    clean = clean.replace(/\s*(мені|мне|me|to)\s*/giu, ' ');
    clean = clean.replace(/(?:в|о|at|à)\s*\d{1,2}(?:[.:]\d{2})?\s*(?:годин|часов|часа|heures|óra)?/giu, '');
    clean = clean.replace(/\d{1,2}[.:]\d{2}/g, '');
    clean = clean.replace(/\d{1,2}\s*(?:годин|часов|часа|heures|óra)/giu, '');
    clean = clean.replace(/[.,!?]+/g, '').replace(/\s+/g, ' ').trim();

    if (!clean) clean = t('remPlaceholder').replace(/[^а-яА-Яіїєґa-zA-Z ]/g, '').trim() || 'reminder';
    if (clean.length > 60) clean = clean.slice(0, 60);

    if (time) {
        $('remTime').value = time;
        $('remText').value = clean;
        addReminder();
    } else {
        // Якщо часу немає — ставимо на завтра 9:00
        $('remTime').value = '09:00';
        $('remText').value = clean;
        addReminder();
        say(t('remAdded', { time: '09:00', text: clean }));
    }
}

// ============================================================
// ДОПОМОГА
// ============================================================
function showHelp() {
    say(t('helpText'));
}

// ============================================================
// СТАРТ
// ============================================================
setLang('uk');
renderReminders();
</script>
